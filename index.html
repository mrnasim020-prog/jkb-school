<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission Form</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f4f7f6; padding: 20px; display: flex; justify-content: center; }
        .form-container { background-color: #ffffff; width: 100%; max-width: 700px; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 20px; border-bottom: 2px solid #4CAF50; padding-bottom: 10px; }
        fieldset { border: 1px solid #ddd; padding: 20px; margin-bottom: 20px; }
        legend { font-weight: bold; color: #4CAF50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .radio-group { display: flex; gap: 15px; }
        .radio-group label { font-weight: normal; }
        button { padding: 12px 25px; border: none; cursor: pointer; }
        button[type="submit"] { background-color: #4CAF50; color: white; }
    </style>
</head>
<body>
<div class="form-container">
    <h2>Admission Form</h2>
    <form action="/submit" method="POST" enctype="multipart/form-data">
        <fieldset><legend>Personal Details</legend>
            <div class="form-group"><label>First Name *</label><input type="text" name="first_name" required></div>
            <div class="form-group"><label>Date of Birth *</label><input type="date" name="dob" required></div>
        </fieldset>
        <fieldset><legend>Contact Information</legend>
            <div class="form-group"><label>Email *</label><input type="email" name="email" required></div>
            <div class="form-group"><label>Phone *</label><input type="tel" name="phone" pattern="[0-9]{10}" required></div>
        </fieldset>
        <button type="submit">Submit</button>
    </form>
</div>
</body>
</html>
