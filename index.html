<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieFlix - Stream Movies Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">MovieFlix</div>
        <form id="search-form">
            <input type="text" id="search-input" placeholder="Search for a movie..." autocomplete="off">
            <button type="submit">Search</button>
        </form>
    </header>

    <main class="container">
        <h2 id="section-title">Trending Movies</h2>
        <div id="movie-grid" class="movie-grid">
            <!-- Movies will be injected here via JavaScript -->
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
