<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.K.B. NATIONAL SCHOOL</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('fees');
            const [paymentMode, setPaymentMode] = useState('online'); // 'online' or 'cash'
            
            // Form Fields
            const [studentClass, setStudentClass] = useState('');
            const [studentName, setStudentName] = useState('');
            const [rollNumber, setRollNumber] = useState('');
            
            // Flow & Receipts
            const [errorMsg, setErrorMsg] = useState('');
            const [step, setStep] = useState(1); // 1: Form, 2: QR Payment, 3: Receipt, 4: Stored Slips
            const [currentReceipt, setCurrentReceipt] = useState(null);
            const [savedReceipts, setSavedReceipts] = useState([]);

            const handleTabSwitch = (tab) => {
                setActiveTab(tab);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const resetForm = () => {
                setStudentClass('');
                setStudentName('');
                setRollNumber('');
                setErrorMsg('');
                setStep(1);
            };

            // Online Payment Validation & Logic
            const handleOnlineProceed = (e) => {
                e.preventDefault();
                setErrorMsg('');

                if (!studentClass || !studentName.trim() || !rollNumber.trim()) {
                    setErrorMsg('Please enter all required student details.');
                    return;
                }

                // Roll Number Logic: Must start with 2024 followed by 01-50 (e.g. 202401)
                const rollRegex = /^2024(0[1-9]|[1-4][0-9]|50)$/;
                if (!rollRegex.test(rollNumber.trim())) {
                    setErrorMsg('Invalid Roll Number! Must start with "2024" followed by 01 to 50 (e.g., 202401).');
                    return;
                }

                setStep(2); // Move to QR / Payment page
            };

            const handleOnlineSuccess = () => {
                const receipt = {
                    receiptId: 'JKB-ONL-' + Math.floor(100000 + Math.random() * 900000),
                    studentName: studentName.trim(),
                    studentClass: studentClass,
                    rollNumber: rollNumber.trim(),
                    amount: '₹ 1,500.00',
                    type: 'Online (UPI / QR Code)',
                    date: new Date().toLocaleDateString('en-GB'),
                    time: new Date().toLocaleTimeString(),
                    status: 'PAYMENT SUCCESSFUL'
                };
                setCurrentReceipt(receipt);
                setSavedReceipts([receipt, ...savedReceipts]);
                setStep(3); // Show Receipt Page
            };

            // Hand Cash Payment Logic
            const handleCashProceed = (e) => {
                e.preventDefault();
                setErrorMsg('');

                if (!studentClass || !studentName.trim() || !rollNumber.trim()) {
                    setErrorMsg('Please fill in Class, Name, and Roll Number.');
                    return;
                }

                const cashReceipt = {
                    receiptId: 'JKB-CSH-' + Math.floor(100000 + Math.random() * 900000),
                    studentName: studentName.trim(),
                    studentClass: studentClass,
                    rollNumber: rollNumber.trim(),
                    amount: '₹ 1,500.00',
                    type: 'Hand Cash (School Counter)',
                    date: new Date().toLocaleDateString('en-GB'),
                    time: new Date().toLocaleTimeString(),
                    status: 'RECEIVED AT COUNTER'
                };
                setCurrentReceipt(cashReceipt);
                setSavedReceipts([cashReceipt, ...savedReceipts]);
                setStep(3); // Show Receipt Page
            };

            return (
                <div class="min-h-screen flex flex-col">
                    {/* Header */}
                    <header class="bg-indigo-900 text-white shadow-lg sticky top-0 z-50">
                        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center">
                            <div class="flex items-center space-x-3 mb-2 md:mb-0 cursor-pointer" onClick={() => handleTabSwitch('home')}>
                                <div class="w-10 h-10 bg-amber-400 text-indigo-950 font-black rounded-full flex items-center justify-center text-lg">
                                    JKB
                                </div>
                                <div>
                                    <h1 class="text-lg font-bold tracking-wide">J.K.B. NATIONAL SCHOOL</h1>
                                    <p class="text-xs text-amber-300">English Medium | Bengali & CBSE Curriculum</p>
                                </div>
                            </div>
                            {/* Navigation */}
                            <nav class="flex flex-wrap gap-1 md:gap-2 text-xs md:text-sm font-medium">
                                <button onClick={() => handleTabSwitch('home')} class={`px-3 py-1.5 rounded ${activeTab === 'home' ? 'bg-amber-400 text-indigo-950 font-bold' : 'hover:bg-indigo-800'}`}>Home</button>
                                <button onClick={() => handleTabSwitch('about')} class={`px-3 py-1.5 rounded ${activeTab === 'about' ? 'bg-amber-400 text-indigo-950 font-bold' : 'hover:bg-indigo-800'}`}>About Us</button>
                                <button onClick={() => handleTabSwitch('teachers')} class={`px-3 py-1.5 rounded ${activeTab === 'teachers' ? 'bg-amber-400 text-indigo-950 font-bold' : 'hover:bg-indigo-800'}`}>Teachers</button>
                                <button onClick={() => handleTabSwitch('admission')} class={`px-3 py-1.5 rounded ${activeTab === 'admission' ? 'bg-amber-400 text-indigo-950 font-bold' : 'hover:bg-indigo-800'}`}>Admission</button>
                                <button onClick={() => handleTabSwitch('food')} class={`px-3 py-1.5 rounded ${activeTab === 'food' ? 'bg-amber-400 text-indigo-950 font-bold' : 'hover:bg-indigo-800'}`}>Food Chart</button>
                                <button onClick={() => handleTabSwitch('rules')} class={`px-3 py-1.5 rounded ${activeTab === 'rules' ? 'bg-amber-400 text-indigo-950 font-bold' : 'hover:bg-indigo-800'}`}>Rules</button>
                                <button onClick={() => { handleTabSwitch('fees'); resetForm(); }} class={`px-3 py-1.5 rounded ${activeTab === 'fees' ? 'bg-amber-400 text-indigo-950 font-bold' : 'bg-emerald-600 hover:bg-emerald-500 font-semibold text-white'}`}>
                                    Fees & Payments
                                </button>
                            </nav>
                        </div>
                    </header>

                    {/* Content Section */}
                    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6">

                        {/* HOME TAB */}
                        {activeTab === 'home' && (
                            <div class="space-y-6">
                                <div class="bg-indigo-900 text-white rounded-2xl p-8 text-center shadow-lg">
                                    <h2 class="text-3xl font-bold mb-2">Welcome to J.K.B. NATIONAL SCHOOL</h2>
                                    <p class="text-amber-300 text-sm mb-6 max-w-xl mx-auto">Educating minds and enriching lives with excellence and values.</p>
                                    <button onClick={() => { handleTabSwitch('fees'); resetForm(); }} class="bg-emerald-500 hover:bg-emerald-400 text-white px-6 py-2.5 rounded-lg font-bold transition">
                                        Pay Monthly Fees
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* ABOUT TAB */}
                        {activeTab === 'about' && (
                            <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-200">
                                <h2 class="text-xl font-bold text-indigo-900 border-b pb-2 mb-4">About Our School</h2>
                                <p class="text-slate-600 text-sm leading-relaxed mb-4">
                                    J.K.B. National School provides quality English medium education focusing on holistic academic growth, discipline, and multi-lingual expertise.
                                </p>
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div class="p-4 bg-slate-50 border rounded-lg">
                                        <h3 class="font-bold text-indigo-900 text-sm">Dr. Rahmatullah</h3>
                                        <p class="text-xs text-indigo-600 font-semibold">PhD (English)</p>
                                    </div>
                                    <div class="p-4 bg-slate-50 border rounded-lg">
                                        <h3 class="font-bold text-indigo-900 text-sm">Santos Kumar Mondal</h3>
                                        <p class="text-xs text-indigo-600 font-semibold">B.Com Hons (PQ)</p>
                                    </div>
                                    <div class="p-4 bg-slate-50 border rounded-lg">
                                        <h3 class="font-bold text-indigo-900 text-sm">Nasim Aktar Sk</h3>
                                        <p class="text-xs text-indigo-600 font-semibold">B.A. (History Hons)</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TEACHERS TAB */}
                        {activeTab === 'teachers' && (
                            <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-200">
                                <h2 class="text-xl font-bold text-indigo-900 border-b pb-4 mb-4">Teachers List</h2>
                                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                                    {[
                                        "Dr. Rahmatullah - PhD (English)",
                                        "Santos Kumar Mondal - B.Com Hons",
                                        "Nasim Aktar Sk - B.A. (History Hons)",
                                        "Md. Wasim Akram - B.A. (Education Hons)",
                                        "Islema Parvin - English Hons, B.Ed",
                                        "Madhumita Sinha - Graduation, D.El.Ed",
                                        "Nayantara Khatun - History Hons",
                                        "Rupsa Das - H.S.",
                                        "Srimanta Mondal - H.S.",
                                        "Khadija Khatun - H.S.",
                                        "Palashi Saha - H.S."
                                    ].map((t, idx) => (
                                        <div key={idx} class="p-3 bg-slate-50 border rounded-lg text-sm font-semibold text-slate-700 flex items-center gap-2">
                                            <i class="fa-solid fa-user-tie text-indigo-600"></i> {t}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* ADMISSION TAB */}
                        {activeTab === 'admission' && (
                            <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-200">
                                <h2 class="text-xl font-bold text-indigo-900 border-b pb-4 mb-4">Admission Details (2026)</h2>
                                <ul class="space-y-2 text-sm text-slate-700">
                                    <li><strong>Admission Start Date:</strong> 2nd February 2026</li>
                                    <li><strong>Entrance Exam:</strong> 21st February 2026</li>
                                    <li><strong>Classes Start:</strong> 1st March 2026</li>
                                    <li><strong>Classes Offered:</strong> Nursery to Class 12</li>
                                </ul>
                            </div>
                        )}

                        {/* FOOD CHART TAB */}
                        {activeTab === 'food' && (
                            <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-200">
                                <h2 class="text-xl font-bold text-indigo-900 border-b pb-4 mb-4">Hostel Weekly Food Schedule</h2>
                                <div class="overflow-x-auto">
                                    <table class="w-full text-xs text-left border border-slate-200">
                                        <thead class="bg-indigo-900 text-white">
                                            <tr>
                                                <th class="p-2 border">Meal Time</th>
                                                <th class="p-2 border">Mon</th>
                                                <th class="p-2 border">Tue</th>
                                                <th class="p-2 border">Wed</th>
                                                <th class="p-2 border">Thu</th>
                                                <th class="p-2 border">Fri</th>
                                                <th class="p-2 border">Sat</th>
                                                <th class="p-2 border">Sun</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y text-slate-700">
                                            <tr>
                                                <td class="p-2 font-bold bg-slate-50 border">Morning</td>
                                                <td class="p-2 border">Suji / Paratha</td>
                                                <td class="p-2 border">Khichdi</td>
                                                <td class="p-2 border">Luchi Sabji</td>
                                                <td class="p-2 border">Egg Roti</td>
                                                <td class="p-2 border">Upma</td>
                                                <td class="p-2 border">Special</td>
                                                <td class="p-2 border">Special</td>
                                            </tr>
                                            <tr>
                                                <td class="p-2 font-bold bg-slate-50 border">Lunch</td>
                                                <td class="p-2 border">Rice, Dal, Veg</td>
                                                <td class="p-2 border">Fish Curry</td>
                                                <td class="p-2 border">Rice & Dal</td>
                                                <td class="p-2 border">Chicken Curry</td>
                                                <td class="p-2 border">Paneer Curry</td>
                                                <td class="p-2 border">Egg Kalia</td>
                                                <td class="p-2 border">Polao & Mutton</td>
                                            </tr>
                                            <tr>
                                                <td class="p-2 font-bold bg-slate-50 border">Night</td>
                                                <td class="p-2 border">Roti Sabji</td>
                                                <td class="p-2 border">Rice Dal</td>
                                                <td class="p-2 border">Roti Tadka</td>
                                                <td class="p-2 border">Roti Sabji</td>
                                                <td class="p-2 border">Rice Dal</td>
                                                <td class="p-2 border">Roti Sabji</td>
                                                <td class="p-2 border">Roti Paneer</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* RULES TAB */}
                        {activeTab === 'rules' && (
                            <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-200">
                                <h2 class="text-xl font-bold text-indigo-900 border-b pb-4 mb-4">School Discipline & Rules</h2>
                                <ul class="list-disc list-inside space-y-2 text-sm text-slate-700">
                                    <li>Students must arrive 10 minutes prior to assembly.</li>
                                    <li>Clean uniform and Identity Card are mandatory every day.</li>
                                    <li>Mobile phones and electronic gadgets are strictly forbidden.</li>
                                    <li>Parents must attend all scheduled Parent-Teacher Meetings (PTM).</li>
                                </ul>
                            </div>
                        )}

                        {/* FEES & PAYMENTS TAB */}
                        {activeTab === 'fees' && (
                            <div class="space-y-6">
                                {/* Mode Selection Controls */}
                                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap gap-3 justify-between items-center">
                                    <div class="flex gap-2">
                                        <button 
                                            onClick={() => { setPaymentMode('online'); resetForm(); }}
                                            class={`px-4 py-2 rounded-lg text-xs md:text-sm font-bold ${paymentMode === 'online' ? 'bg-indigo-900 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
                                        >
                                            <i class="fa-solid fa-qrcode mr-1"></i> Online Payment
                                        </button>
                                        <button 
                                            onClick={() => { setPaymentMode('cash'); resetForm(); }}
                                            class={`px-4 py-2 rounded-lg text-xs md:text-sm font-bold ${paymentMode === 'cash' ? 'bg-indigo-900 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
                                        >
                                            <i class="fa-solid fa-money-bill-wave mr-1"></i> Hand Cash Payment
                                        </button>
                                    </div>

                                    {/* Download Stored Receipts Store */}
                                    <button
