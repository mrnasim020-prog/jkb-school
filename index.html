<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.K.B. NATIONAL SCHOOL</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX compilation in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('home');
            
            // Payment Portal State
            const [paymentMode, setPaymentMode] = useState('online'); // 'online' or 'cash'
            const [studentClass, setStudentClass] = useState('');
            const [rollNumber, setRollNumber] = useState('');
            const [studentName, setStudentName] = useState('');
            const [errorMessage, setErrorMessage] = useState('');
            const [paymentStep, setPaymentStep] = useState(1); // 1: Input Form, 2: Payment Gateway, 3: Receipt
            
            // Receipt Data State
            const [currentReceipt, setCurrentReceipt] = useState(null);
            const [savedReceipts, setSavedReceipts] = useState([]);

            // Navigation Handlers
            const navigateTo = (tab) => {
                setActiveTab(tab);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            // Online Payment Step 1 Validation & Proceed
            const handleProceedOnlinePayment = (e) => {
                e.preventDefault();
                setErrorMessage('');

                // Validation Rule: Roll number must start with 2024 followed by a 2-digit number from 01 to 50 (e.g. 202401 to 202450)
                const rollRegex = /^2024(0[1-9]|[1-4][0-9]|50)$/;

                if (!studentClass || !studentName.trim() || !rollNumber.trim()) {
                    setErrorMessage('Please fill in all mandatory student details.');
                    return;
                }

                if (!rollRegex.test(rollNumber.trim())) {
                    setErrorMessage('Invalid Roll Number! Roll number must start with "2024" followed by 01 to 50 (Example: 202401).');
                    return;
                }

                // Proceed to QR / Payment Page
                setPaymentStep(2);
            };

            // Online Payment Step 2 Completion
            const handleCompleteOnlinePayment = () => {
                const newReceipt = {
                    receiptId: 'JKB-ONL-' + Math.floor(100000 + Math.random() * 900000),
                    studentName: studentName.trim(),
                    studentClass: studentClass,
                    rollNumber: rollNumber.trim(),
                    amount: '₹ 1,500.00',
                    paymentType: 'Online (UPI / QR Code)',
                    date: new Date().toLocaleDateString('en-GB'),
                    time: new Date().toLocaleTimeString(),
                    status: 'SUCCESS'
                };
                
                setCurrentReceipt(newReceipt);
                setSavedReceipts(prev => [newReceipt, ...prev]);
                setPaymentStep(3);
            };

            // Hand Cash Payment Processing
            const handleProcessCashPayment = (e) => {
                e.preventDefault();
                setErrorMessage('');

                if (!studentClass || !studentName.trim() || !rollNumber.trim()) {
                    setErrorMessage('Please fill in all details for cash receipt generation.');
                    return;
                }

                const cashReceipt = {
                    receiptId: 'JKB-CSH-' + Math.floor(100000 + Math.random() * 900000),
                    studentName: studentName.trim(),
                    studentClass: studentClass,
                    rollNumber: rollNumber.trim(),
                    amount: '₹ 1,500.00',
                    paymentType: 'Hand Cash (School Counter)',
                    date: new Date().toLocaleDateString('en-GB'),
                    time: new Date().toLocaleTimeString(),
                    status: 'RECEIVED AT COUNTER'
                };

                setCurrentReceipt(cashReceipt);
                setSavedReceipts(prev => [cashReceipt, ...prev]);
                setPaymentStep(3);
            };

            // Reset Payment Forms
            const resetPaymentForm = () => {
                setStudentClass('');
                setRollNumber('');
                setStudentName('');
                setErrorMessage('');
                setPaymentStep(1);
            };

            return (
                <div class="min-h-screen flex flex-col">
                    {/* Header Banner */}
                    <header class="bg-indigo-900 text-white shadow-lg sticky top-0 z-50">
                        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center">
                            <div class="flex items-center space-x-3 mb-2 md:mb-0 cursor-pointer" onClick={() => navigateTo('home')}>
                                <div class="w-12 h-12 bg-amber-400 rounded-full flex items-center justify-center text-indigo-900 font-bold text-xl border-2 border-white">
                                    JKB
                                </div>
                                <div>
                                    <h1 class="text-xl font-bold tracking-wide">J.K.B. NATIONAL SCHOOL</h1>
                                    <p class="text-xs text-amber-300">Bengali & CBSE Curriculum | English Medium</p>
                                </div>
                            </div>
                            {/* Navigation Bar */}
                            <nav class="flex flex-wrap gap-1 md:gap-2 text-sm font-medium">
                                <button onClick={() => navigateTo('home')} class={`px-3 py-1.5 rounded transition ${activeTab === 'home' ? 'bg-amber-400 text-indigo-950 font-bold' : 'hover:bg-indigo-800'}`}>Home</button>
                                <button onClick={() => navigateTo('about')} class={`px-3 py-1.5 rounded transition ${activeTab === 'about' ? 'bg-amber-400 text-indigo-950 font-bold' : 'hover:bg-indigo-800'}`}>About Us</button>
                                <button onClick={() => navigateTo('teachers')} class={`px-3 py-1.5 rounded transition ${activeTab === 'teachers' ? 'bg-amber-400 text-indigo-950 font-bold' : 'hover:bg-indigo-800'}`}>Teachers List</button>
                                <button onClick={() => navigateTo('admission')} class={`px-3 py-1.5 rounded transition ${activeTab === 'admission' ? 'bg-amber-400 text-indigo-950 font-bold' : 'hover:bg-indigo-800'}`}>Admission Portal</button>
                                <button onClick={() => navigateTo('food')} class={`px-3 py-1.5 rounded transition ${activeTab === 'food' ? 'bg-amber-400 text-indigo-950 font-bold' : 'hover:bg-indigo-800'}`}>Food Chart</button>
                                <button onClick={() => navigateTo('rules')} class={`px-3 py-1.5 rounded transition ${activeTab === 'rules' ? 'bg-amber-400 text-indigo-950 font-bold' : 'hover:bg-indigo-800'}`}>Rules & Guidelines</button>
                                <button onClick={() => { navigateTo('fees'); resetPaymentForm(); }} class={`px-3 py-1.5 rounded transition ${activeTab === 'fees' ? 'bg-amber-400 text-indigo-950 font-bold' : 'bg-emerald-600 hover:bg-emerald-500 font-semibold'}`}>
                                    <i class="fa-solid fa-credit-card mr-1"></i> Fees & Payments
                                </button>
                            </nav>
                        </div>
                    </header>

                    {/* Main Dynamic Content Area */}
                    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6">

                        {/* TAB 1: HOME */}
                        {activeTab === 'home' && (
                            <div class="space-y-6">
                                <div class="bg-indigo-800 text-white rounded-2xl p-8 text-center shadow-md relative overflow-hidden">
                                    <h2 class="text-3xl font-extrabold mb-2">Welcome to J.K.B. NATIONAL SCHOOL</h2>
                                    <p class="text-amber-300 text-lg mb-6 max-w-2xl mx-auto">The premier institution dedicated to fulfilling students' academic aspirations and moral development.</p>
                                    <div class="flex flex-wrap justify-center gap-4">
                                        <button onClick={() => navigateTo('admission')} class="bg-amber-400 text-indigo-950 px-6 py-2.5 rounded-lg font-bold hover:bg-amber-300 transition">Admission Open 2026</button>
                                        <button onClick={() => { navigateTo('fees'); resetPaymentForm(); }} class="bg-emerald-500 text-white px-6 py-2.5 rounded-lg font-bold hover:bg-emerald-400 transition">Pay Monthly Fees Online</button>
                                    </div>
                                </div>

                                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                                        <div class="text-indigo-600 text-2xl mb-3"><i class="fa-solid fa-book-open"></i></div>
                                        <h3 class="font-bold text-lg mb-2">Comprehensive Study Plan</h3>
                                        <p class="text-sm text-slate-600">Daily study materials, regular unit tests, class tests, and smart mock tests for concept clearing.</p>
                                    </div>
                                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                                        <div class="text-indigo-600 text-2xl mb-3"><i class="fa-solid fa-[#00A86B] fa-building"></i></div>
                                        <h3 class="font-bold text-lg mb-2">Hostel & Campus</h3>
                                        <p class="text-sm text-slate-600">Separate hostel available with nutritional food menu, disciplined environment, and continuous faculty care.</p>
                                    </div>
                                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                                        <div class="text-indigo-600 text-2xl mb-3"><i class="fa-solid fa-language"></i></div>
                                        <h3 class="font-bold text-lg mb-2">Language Skills</h3>
                                        <p class="text-sm text-slate-600">Special focus on spoken English communication, multi-lingual proficiency, and personality development.</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 2: ABOUT US */}
                        {activeTab === 'about' && (
                            <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-200 space-y-6">
                                <h2 class="text-2xl font-bold text-indigo-900 border-b pb-2">About Our Institution</h2>
                                <p class="text-slate-700 leading-relaxed">
                                    J.K.B. National School stands as a beacon of modern education blending Bengali traditions with CBSE standards in an English Medium framework. We focus on academic excellence, physical health, and moral integrity.
                                </p>
                                
                                <h3 class="text-xl font-bold text-indigo-900 pt-4">Administration & Leadership</h3>
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div class="p-4 bg-slate-50 rounded-lg border">
                                        <h4 class="font-bold text-indigo-900">Dr. Rahmatullah</h4>
                                        <p class="text-xs text-indigo-600 font-semibold mb-2">PhD (English)</p>
                                        <p class="text-sm text-slate-600">Deep expertise in English literature and language guidance.</p>
                                    </div>
                                    <div class="p-4 bg-slate-50 rounded-lg border">
                                        <h4 class="font-bold text-indigo-900">Santos Kumar Mondal</h4>
                                        <p class="text-xs text-indigo-600 font-semibold mb-2">B.Com Hons (PQ)</p>
                                        <p class="text-sm text-slate-600">Accurate direction in Commerce and Mathematical problem-solving.</p>
                                    </div>
                                    <div class="p-4 bg-slate-50 rounded-lg border">
                                        <h4 class="font-bold text-indigo-900">Nasim Aktar Sk</h4>
                                        <p class="text-xs text-indigo-600 font-semibold mb-2">B.A. (History Hons)</p>
                                        <p class="text-sm text-slate-600">Bringing historical events to life with interactive pedagogical techniques.</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 3: TEACHERS LIST */}
                        {activeTab === 'teachers' && (
                            <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-200">
                                <h2 class="text-2xl font-bold text-indigo-900 border-b pb-4 mb-4">Our Dedicated Faculty</h2>
                                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {[
                                        { id: 1, name: "Dr. Rahmatullah", qual: "PhD (English), B.Ed", role: "English Literature & Higher Grammar" },
                                        { id: 2, name: "Santos Kumar Mondal", qual: "B.Com Hons (PQ)", role: "Mathematics & Commerce" },
                                        { id: 3, name: "Nasim Aktar Sk", qual: "B.A. (History Hons)", role: "History & Social Sciences" },
                                        { id: 4, name: "Md. Wasim Akram", qual: "B.A. (Education Hons)", role: "Education & Modern Teaching Methods" },
                                        { id: 5, name: "Islema Parvin", qual: "M.A. English Hons, B.Ed", role: "English Language & Literature" },
                                        { id: 6, name: "Madhumita Sinha", qual: "English Graduation, D.El.Ed", role: "Primary Education & Foundation English" },
                                        { id: 7, name: "Nayantara Khatun", qual: "B.A. History Hons", role: "Historical Analysis & Social Studies" },
                                        { id: 8, name: "Rupsa Das", qual: "H.S.", role: "Primary Care & Pre-Primary Learning" },
                                        { id: 9, name: "Srimanta Mondal", qual: "H.S.", role: "Discipline & Physical Education" },
                                        { id: 10, name: "Khadija Khatun", qual: "H.S.", role: "Moral Education & Behavioral Care" },
                                        { id: 11, name: "Palashi Saha", qual: "H.S.", role: "Early Childhood Education" },
                                    ].map(teacher => (
                                        <div key={teacher.id} class="p-4 rounded-lg border border-slate-200 bg-slate-50 hover:shadow-md transition">
                                            <div class="flex items-center space-x-3">
                                                <div class="w-10 h-10 bg-indigo-100 text-indigo-800 rounded-full flex items-center justify-center font-bold">
                                                    {teacher.id}
                                                </div>
                                                <div>
                                                    <h3 class="font-bold text-slate-900">{teacher.name}</h3>
                                                    <p class="text-xs text-indigo-700 font-medium">{teacher.qual}</p>
                                                    <p class="text-xs text-slate-500 mt-1">{teacher.role}</p>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* TAB 4: ADMISSION PORTAL */}
                        {activeTab === 'admission' && (
                            <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-200 space-y-6">
                                <h2 class="text-2xl font-bold text-indigo-900 border-b pb-2">Admission Portal (2026 Session)</h2>
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div class="p-4 bg-amber-50 border border-amber-200 rounded-lg">
                                        <h4 class="font-bold text-amber-900">Admission Starts</h4>
                                        <p class="text-xl font-extrabold text-amber-700">2nd February 2026</p>
                                    </div>
                                    <div class="p-4 bg-indigo-50 border border-indigo-200 rounded-lg">
                                        <h4 class="font-bold text-indigo-900">Entrance Examination</h4>
                                        <p class="text-xl font-extrabold text-indigo-700">21st February 2026</p>
                                    </div>
                                    <div class="p-4 bg-emerald-50 border border-emerald-200 rounded-lg">
                                        <h4 class="font-bold text-emerald-900">Classes Commence</h4>
                                        <p class="text-xl font-extrabold text-emerald-700">1st March 2026</p>
                                    </div>
                                </div>

                                <div class="border-t pt-4">
                                    <h3 class="font-bold text-lg mb-2">Teaching Levels Offered:</h3>
                                    <ul class="list-disc list-inside space-y-1 text-slate-700">
                                        <li><strong>Nursery to Class IV:</strong> English Medium Day School Program</li>
                                        <li><strong>Class V to Class XII:</strong> Science & Arts Streams with Hostel Facilities</li>
                                    </ul>
                                </div>
                            </div>
                        )}

                        {/* TAB 5: FOOD CHART */}
                        {activeTab === 'food' && (
                            <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-200">
                                <h2 class="text-2xl font-bold text-indigo-900 border-b pb-4 mb-4">Hostel Weekly Nutrition & Food Schedule</h2>
                                <div class="overflow-x-auto">
                                    <table class="w-full text-sm text-left border-collapse border border-slate-200">
                                        <thead class="bg-indig
